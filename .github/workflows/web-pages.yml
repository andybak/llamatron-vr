name: Web release to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.commits.outputs.releases }}
      has_releases: ${{ steps.commits.outputs.has_releases }}
      latest: ${{ steps.commits.outputs.latest }}
    steps:
      - id: commits
        name: Find every marked commit in this push
        shell: python
        run: |
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          releases = [{'sha': c['id']} for c in event.get('commits', []) if '[RELEASE]' in c['message']]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'releases={json.dumps({"include": releases})}\n')
              output.write(f'has_releases={str(bool(releases)).lower()}\n')
              output.write(f'latest={releases[-1]["sha"] if releases else ""}\n')

  build:
    needs: plan
    if: needs.plan.outputs.has_releases == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.releases) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - name: Select Unity build license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL || vars.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [[ -n "$UNITY_SERIAL" || -n "$UNITY_LICENSE" ]]; then
            if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
              echo '::error::A custom Unity license requires UNITY_EMAIL and UNITY_PASSWORD. See standalone/WEB.md.'
              exit 1
            fi
          else
            # Same public Personal-license fallback as Open Brush's build workflow.
            UNITY_EMAIL='unitytest@mikeage.net'
            UNITY_PASSWORD='DoNotStealThis1'
            UNITY_LICENSE=$(cat tools/ci/unity-personal.ulf)
          fi
          delimiter="UNITY_LICENSE_$(cat /proc/sys/kernel/random/uuid)"
          {
            echo "UNITY_EMAIL=$UNITY_EMAIL"
            echo "UNITY_PASSWORD=$UNITY_PASSWORD"
            echo "UNITY_SERIAL=$UNITY_SERIAL"
            echo "UNITY_LICENSE<<$delimiter"
            echo "$UNITY_LICENSE"
            echo "$delimiter"
          } >> "$GITHUB_ENV"

      # Include generated asset metadata so fresh GUIDs don't defeat Library reuse.
      # The source hash excludes that generated folder; its inputs are hashed instead.
      - name: Restore Unity WebGL cache
        id: unity-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            standalone/Unity/Library
            standalone/Unity/Assets/Llamatron/Resources/Generated
          key: UnityWebGL-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('standalone/Unity/ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('standalone/Unity/Packages/**') }}-${{ hashFiles('standalone/Unity/Assets/**', '!standalone/Unity/Assets/Llamatron/Resources/Generated/**', 'standalone/Unity/ProjectSettings/**', 'tools/prepare_unity_web.py', 'tools/inspect_game.py', 'tools/export_sprites.py', 'tools/export_standalone_assets.py', 'tools/recover_audio.py', 'tools/fixtures/unity-web-profile.json') }}
          restore-keys: |
            UnityWebGL-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('standalone/Unity/ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('standalone/Unity/Packages/**') }}-

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Recreate original sprite and PCM assets
        run: |
          python -m pip install Pillow==11.3.0
          python tools/prepare_unity_web.py

      - name: Check gameplay and portable save replay
        run: |
          node --test tools/test_web_updates.mjs
          dotnet run --project standalone/Checks/Llamatron.Checks.csproj
          dotnet run --project standalone/StateTool -- sweep --atlas standalone/Unity/Assets/Llamatron/Resources/Generated/atlas.json --output artifacts/ci-gameplay/waves
          dotnet run --project standalone/StateTool -- campaign --reload-every 100 --output artifacts/ci-gameplay/campaign
          dotnet run --project standalone/StateTool -- campaign --reload-every 0 --output artifacts/ci-gameplay/uninterrupted
          cmp artifacts/ci-gameplay/campaign/final.llsave artifacts/ci-gameplay/uninterrupted/final.llsave

      - name: Build Unity WebGL release
        uses: game-ci/unity-builder@adaf7cd8f42fd48fbbf2d4f5f67ca30d87f819f1 # v5
        with:
          projectPath: standalone/Unity
          unityVersion: 6000.3.18f1
          targetPlatform: WebGL
          buildMethod: Llamatron.Editor.StandaloneBuild.BuildWebCi
          versioning: None

      - name: Verify complete web output and offline URLs
        run: python tools/validate_web_build.py

      # Save after a verified build, even if a later artifact upload fails. Only the
      # newest marked commit writes, avoiding competing matrix jobs and cache churn.
      - name: Save verified Unity WebGL cache
        if: matrix.sha == needs.plan.outputs.latest && steps.unity-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            standalone/Unity/Library
            standalone/Unity/Assets/Llamatron/Resources/Generated
          key: ${{ steps.unity-cache.outputs.cache-primary-key }}

      - name: Retain each marked commit's web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Web-${{ matrix.sha }}
          path: artifacts/standalone/web
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # A Pages site has one live version: use the newest marked commit in the push.
      - name: Upload newest marked build for Pages
        if: matrix.sha == needs.plan.outputs.latest
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: artifacts/standalone/web

      - name: Upload Unity logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Web-logs-${{ matrix.sha }}
          path: |
            standalone/Unity/Logs
            artifacts/unity-web-input/audio-assets.json
            artifacts/ci-gameplay
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: [plan, build]
    if: needs.plan.outputs.has_releases == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Keep an older slow build from replacing a newer deployment
        id: order
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          publish=true
          newer_runs=$(gh api --paginate "repos/$GH_REPO/actions/workflows/web-pages.yml/runs?branch=main&event=push&status=success&per_page=100" \
            --jq ".workflow_runs[] | select(.run_number > $RUN_NUMBER) | .id")
          for run in $newer_runs; do
            deployed=$(gh api --paginate "repos/$GH_REPO/actions/runs/$run/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "deploy" and .conclusion == "success") | .id')
            if [[ -n "$deployed" ]]; then
              publish=false
              echo 'A newer release is already deployed; keeping that version live.'
              break
            fi
          done
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - if: steps.order.outputs.publish == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish newest marked build
        if: steps.order.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
